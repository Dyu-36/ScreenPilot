[package]
name = "manager"
version = "2.0.0"
edition = "2024"
description = "Lightweight cross-platform manager controlled from a paired Zalo chat"
default-run = "ManagerUI"

[features]
default = ["ui"]
ui = ["dep:eframe", "dep:rand"]

[dependencies]
anyhow = "1.0"
eframe = { version = "0.29", optional = true }
rand = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
xcap = "0.9.8"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "Manager"
path = "src/main.rs"

[[bin]]
name = "ManagerUI"
path = "src/bin/manager-ui.rs"
required-features = ["ui"]

[[bin]]
name = "ManagerCapture"
path = "src/bin/manager-capture.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
