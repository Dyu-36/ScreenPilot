name: Windows PR CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-go:
    runs-on: windows-latest

    steps:
      - name: Disable Git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            $files
            throw "gofmt required"
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build release
        shell: cmd
        run: build-release.cmd

      - name: Verify release files
        shell: pwsh
        run: |
          foreach ($file in @("dist\Manager.exe", "dist\ManagerUI.exe", "dist\ManagerCapture.exe")) {
            if (!(Test-Path $file)) {
              throw "Expected $file was not created"
            }
          }
