name: Cleanup stale branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete stale branches
        shell: bash
        run: |
          git push origin --delete feat/complete-tack-agent || true
          git push origin --delete feat/windows-zalo-pair-agent || true
          git push origin --delete optimize/lazy-screenshot-runtime || true
          git push origin --delete tmp-unused || true
