name: Build Manager for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Verify executables
        shell: pwsh
        run: |
          $files = @(
            "target\release\Manager.exe",
            "target\release\ManagerUI.exe",
            "target\release\ManagerCapture.exe"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Expected $file was not created"
            }
            Get-Item $file | Format-List Name,Length,LastWriteTime
          }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: manager-windows
          path: |
            target/release/Manager.exe
            target/release/ManagerUI.exe
            target/release/ManagerCapture.exe
          if-no-files-found: error
          retention-days: 30
