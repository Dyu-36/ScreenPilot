name: Build tack-agent for Windows

on:
  push:
    branches:
      - feat/windows-zalo-pair-agent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target\release\tack-agent.exe"
          if (!(Test-Path $exe)) {
            throw "Expected $exe was not created"
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Upload tack-agent.exe
        uses: actions/upload-artifact@v4
        with:
          name: tack-agent-windows
          path: target/release/tack-agent.exe
          if-no-files-found: error
          retention-days: 30
