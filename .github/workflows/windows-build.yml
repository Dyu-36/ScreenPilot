name: Build Manager for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and validate
        shell: cmd
        run: build-release.cmd

      - name: Verify executables
        shell: pwsh
        run: |
          $files = @(
            "dist\Manager.exe",
            "dist\ManagerUI.exe",
            "dist\ManagerCapture.exe"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Expected $file was not created"
            }
            Get-Item $file | Format-List Name,Length,LastWriteTime
          }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: manager-windows
          path: |
            dist/Manager.exe
            dist/ManagerUI.exe
            dist/ManagerCapture.exe
          if-no-files-found: error
          retention-days: 30
